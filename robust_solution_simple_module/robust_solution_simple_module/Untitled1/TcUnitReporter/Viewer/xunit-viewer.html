<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TcUnit xUnit XML 測試報告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fa;
      --surface: #fff;
      --soft: #f8fafc;
      --line: #dce3ec;
      --text: #172033;
      --muted: #687588;
      --primary: #2563eb;
      --primary-soft: #eaf1ff;
      --pass: #16835d;
      --pass-soft: #e8f7f1;
      --fail: #c53c3c;
      --fail-soft: #fff0f0;
      --skip: #a26611;
      --skip-soft: #fff6df;
      --shadow: 0 12px 32px rgba(23, 32, 51, .08);
      font-family: Inter, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 5% -10%, #e7efff 0, transparent 28rem), var(--bg); }
    button, input { font: inherit; }
    button { border: 1px solid var(--line); border-radius: 9px; padding: .68rem 1rem; color: var(--text); background: var(--surface); cursor: pointer; }
    button:hover:not(:disabled) { border-color: #aeb8c7; background: var(--soft); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    button.primary:hover { background: #1d4ed8; }

    .header { position: sticky; z-index: 20; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.2rem clamp(1rem, 3vw, 2.25rem); border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: clamp(1.15rem, 2vw, 1.55rem); letter-spacing: -.02em; }
    .subtitle { margin-top: .28rem; color: var(--muted); font: .84rem Consolas, monospace; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .65rem; }
    main { width: min(1280px, calc(100% - 2rem)); margin: 1.4rem auto 3rem; }

    .drop-zone { min-height: 55vh; display: grid; place-items: center; padding: 2rem; text-align: center; border: 2px dashed #b9c5d5; border-radius: 18px; background: rgba(255, 255, 255, .75); box-shadow: var(--shadow); transition: .15s; }
    .drop-zone.dragging { border-color: var(--primary); background: var(--primary-soft); transform: scale(1.005); }
    .drop-icon { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 1.1rem; border-radius: 18px; color: var(--primary); background: var(--primary-soft); font-size: 1.8rem; }
    .drop-zone h2 { margin: 0 0 .45rem; font-size: 1.25rem; }
    .drop-zone p { margin: 0 0 .45rem; color: var(--muted); }
    .drop-zone .path { margin-bottom: 1.35rem; overflow-wrap: anywhere; font: .8rem Consolas, monospace; }
    .notice { margin-bottom: 1rem; padding: .9rem 1rem; color: #8f2727; border: 1px solid #f0baba; border-radius: 10px; background: var(--fail-soft); }
    .hidden { display: none !important; }

    .summary-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .8rem; margin-bottom: 1rem; }
    .summary-card { padding: 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 4px 16px rgba(23, 32, 51, .04); }
    .summary-label { margin-bottom: .45rem; color: var(--muted); font-size: .82rem; }
    .summary-value { font: 700 clamp(1.18rem, 2.2vw, 1.65rem)/1 Consolas, monospace; }
    .summary-card.pass .summary-value { color: var(--pass); }
    .summary-card.fail .summary-value { color: var(--fail); }
    .summary-card.skip .summary-value { color: var(--skip); }

    .toolbar { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; padding: .8rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .search { flex: 1; min-width: 12rem; padding: .72rem .85rem; color: var(--text); border: 1px solid var(--line); border-radius: 9px; outline: none; }
    .search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .filters { display: flex; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
    .filters button { border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: .65rem .85rem; }
    .filters button:last-child { border-right: 0; }
    .filters button.active { color: #fff; background: var(--primary); }

    .results { display: grid; gap: .8rem; }
    details { overflow: clip; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    details[open] { box-shadow: 0 7px 22px rgba(23, 32, 51, .06); }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    .suite-summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: .8rem; padding: .9rem 1rem; background: var(--soft); font-weight: 650; }
    .tests { border-top: 1px solid var(--line); }
    .test { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; box-shadow: none !important; }
    .test:last-child { border-bottom: 0; }
    .test-summary { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: .75rem; padding: .78rem 1rem; }
    .test-summary:hover { background: #fbfcfe; }
    .chevron { color: #94a0af; transition: transform .15s; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    .status-dot { width: .68rem; height: .68rem; border-radius: 50%; background: var(--pass); }
    .status-dot.failed { background: var(--fail); }
    .status-dot.skipped { background: var(--skip); }
    .test-name { min-width: 0; overflow-wrap: anywhere; font-family: Consolas, monospace; }
    .meta { color: var(--muted); font: .82rem Consolas, monospace; white-space: nowrap; }
    .badge { padding: .25rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
    .badge.passed { color: var(--pass); background: var(--pass-soft); }
    .badge.failed { color: var(--fail); background: var(--fail-soft); }
    .badge.skipped { color: var(--skip); background: var(--skip-soft); }
    .failure { margin: 0 1rem 1rem 3.35rem; padding: .85rem 1rem; border-left: 3px solid var(--fail); border-radius: 0 8px 8px 0; background: var(--fail-soft); }
    .failure-type { margin-bottom: .35rem; color: var(--fail); font: 700 .78rem Consolas, monospace; }
    .failure-message { white-space: pre-wrap; overflow-wrap: anywhere; font: .86rem Consolas, monospace; }
    .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

    @media (max-width: 900px) {
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .toolbar { align-items: stretch; flex-direction: column; }
      .filters { overflow-x: auto; }
      .filters button { flex: 1; }
    }
    @media (max-width: 600px) {
      .header { align-items: flex-start; flex-direction: column; }
      .actions, .actions button { width: 100%; }
      main { width: min(100% - 1rem, 1280px); margin-top: .6rem; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .suite-summary { grid-template-columns: auto minmax(0, 1fr) auto; }
      .suite-duration { display: none; }
      .test-summary { grid-template-columns: auto auto minmax(0, 1fr) auto; }
      .class-name { display: none; }
      .failure { margin-left: 2.75rem; }
    }
    @media print {
      @page { margin: 12mm; }
      body { background: #fff; }
      .header { position: static; padding: 0 0 1rem; border-bottom: 2px solid #333; }
      .actions, .toolbar, .drop-zone, .notice { display: none !important; }
      main { width: 100%; margin: 1rem 0 0; }
      .summary-grid { grid-template-columns: repeat(6, 1fr); break-inside: avoid; }
      .summary-card, details { box-shadow: none !important; }
      details, .test { break-inside: avoid; }
      .suite-summary, .test-summary { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <h1>TcUnit xUnit XML 測試報告</h1>
      <div id="subtitle" class="subtitle">尚未載入報告</div>
    </div>
    <div class="actions">
      <button id="openButton" class="primary" type="button">開啟 XML 報告</button>
      <button id="printButton" type="button" disabled>列印／輸出 PDF</button>
    </div>
  </header>

  <main>
    <input id="fileInput" class="hidden" type="file" accept=".xml,text/xml,application/xml">
    <div id="notice" class="notice hidden" role="alert"></div>

    <section id="dropZone" class="drop-zone" aria-label="載入 TcUnit xUnit XML 報告">
      <div>
        <div class="drop-icon" aria-hidden="true">⇩</div>
        <h2>將 tcunit_xunit_testresults.xml 拖放至此</h2>
        <p>或從本機選取 TcUnit 內建 xUnit Publisher 產生的 XML。</p>
        <p class="path">4026 Usermode 預設：C:\ProgramData\Beckhoff\TwinCAT\3.1\Runtimes\UmRT_Default\3.1\Boot\</p>
        <button id="dropOpenButton" class="primary" type="button">選擇 XML 報告</button>
      </div>
    </section>

    <section id="report" class="hidden" aria-live="polite">
      <div id="summary" class="summary-grid"></div>
      <div class="toolbar">
        <input id="searchInput" class="search" type="search" placeholder="搜尋 suite、測試名稱、class 或失敗訊息…" aria-label="搜尋測試結果">
        <div id="filters" class="filters" aria-label="狀態篩選">
          <button type="button" data-status="all" class="active">全部</button>
          <button type="button" data-status="failed">失敗</button>
          <button type="button" data-status="skipped">略過</button>
          <button type="button" data-status="passed">通過</button>
        </div>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script>
    'use strict';

    const elements = {
      fileInput: document.querySelector('#fileInput'),
      openButton: document.querySelector('#openButton'),
      dropOpenButton: document.querySelector('#dropOpenButton'),
      printButton: document.querySelector('#printButton'),
      dropZone: document.querySelector('#dropZone'),
      report: document.querySelector('#report'),
      notice: document.querySelector('#notice'),
      subtitle: document.querySelector('#subtitle'),
      summary: document.querySelector('#summary'),
      searchInput: document.querySelector('#searchInput'),
      filters: document.querySelector('#filters'),
      results: document.querySelector('#results')
    };

    const state = { report: null, status: 'all', query: '' };
    const maxFileBytes = 10 * 1024 * 1024;

    function requireCondition(condition, message) {
      if (!condition) throw new Error(message);
    }

    function elementChildren(parent, localName) {
      return [...parent.children].filter(child => child.localName === localName);
    }

    function numberAttribute(element, name, fallback = 0) {
      const raw = element.getAttribute(name);
      if (raw === null || raw.trim() === '') return fallback;
      const value = Number(raw);
      requireCondition(Number.isFinite(value) && value >= 0, `${element.localName}.${name} 必須是非負數。`);
      return value;
    }

    function parseStatus(testcase) {
      const status = (testcase.getAttribute('status') || '').trim().toUpperCase();
      if (elementChildren(testcase, 'failure').length || elementChildren(testcase, 'error').length || status === 'FAIL' || status === 'FAILED') return 'failed';
      if (elementChildren(testcase, 'skipped').length || status === 'SKIP' || status === 'SKIPPED') return 'skipped';
      requireCondition(status === '' || status === 'PASS' || status === 'PASSED' || status === 'SUCCESS', `不支援 testcase status="${status}"。`);
      return 'passed';
    }

    function parseFailure(testcase) {
      const failure = elementChildren(testcase, 'failure')[0] || elementChildren(testcase, 'error')[0];
      if (!failure) return null;
      const message = failure.getAttribute('message') || failure.textContent.trim() || 'No failure message was recorded.';
      return { type: failure.getAttribute('type') || failure.localName.toUpperCase(), message };
    }

    function parseXUnitXml(text) {
      requireCondition(!/<\s*!DOCTYPE|<\s*!ENTITY/i.test(text), '基於安全考量，不接受含 DOCTYPE 或 ENTITY 的 XML。');
      const documentNode = new DOMParser().parseFromString(text, 'application/xml');
      const parserError = documentNode.querySelector('parsererror');
      requireCondition(!parserError, `XML 格式損壞：${parserError?.textContent.trim() || ''}`);
      const root = documentNode.documentElement;
      requireCondition(root?.localName === 'testsuites', '根節點必須是 <testsuites>。');

      const suites = elementChildren(root, 'testsuite').map((suiteNode, suiteIndex) => {
        const tests = elementChildren(suiteNode, 'testcase').map((testNode, testIndex) => {
          const name = testNode.getAttribute('name');
          requireCondition(name !== null, `testsuite[${suiteIndex}].testcase[${testIndex}] 缺少 name。`);
          return {
            name,
            className: testNode.getAttribute('classname') || '',
            durationSeconds: numberAttribute(testNode, 'time'),
            status: parseStatus(testNode),
            failure: parseFailure(testNode)
          };
        });
        return {
          id: suiteNode.getAttribute('id') || String(suiteIndex + 1),
          name: suiteNode.getAttribute('name') || `Test suite ${suiteIndex + 1}`,
          durationSeconds: numberAttribute(suiteNode, 'time', tests.reduce((sum, test) => sum + test.durationSeconds, 0)),
          tests
        };
      });

      const suiteDuration = suites.reduce((sum, suite) => sum + suite.durationSeconds, 0);
      return { durationSeconds: numberAttribute(root, 'time', suiteDuration), suites };
    }

    function deriveSummary(report) {
      const tests = report.suites.flatMap(suite => suite.tests);
      const counts = { passed: 0, failed: 0, skipped: 0 };
      tests.forEach(test => { counts[test.status] += 1; });
      return { suites: report.suites.length, tests: tests.length, ...counts };
    }

    function formatDuration(seconds) {
      if (seconds < 1) return `${Math.round(seconds * 1000)} ms`;
      if (seconds < 60) return `${seconds.toFixed(seconds < 10 ? 3 : 2)} s`;
      return `${Math.floor(seconds / 60)}m ${(seconds % 60).toFixed(1)}s`;
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderSummary(report) {
      const summary = deriveSummary(report);
      const passRate = summary.tests === 0 ? 0 : summary.passed / summary.tests * 100;
      const cards = [
        ['執行時間', formatDuration(report.durationSeconds), ''],
        ['Test suites', String(summary.suites), ''],
        ['測試案例', String(summary.tests), ''],
        ['通過率', `${passRate.toFixed(1)}%`, 'pass'],
        ['失敗案例', String(summary.failed), 'fail'],
        ['略過案例', String(summary.skipped), 'skip']
      ];
      elements.summary.replaceChildren(...cards.map(([label, value, tone]) => {
        const card = createElement('div', `summary-card ${tone}`.trim());
        card.append(createElement('div', 'summary-label', label), createElement('div', 'summary-value', value));
        return card;
      }));
    }

    function matches(test, suiteName) {
      if (state.status !== 'all' && test.status !== state.status) return false;
      if (!state.query) return true;
      return [suiteName, test.name, test.className, test.failure?.type, test.failure?.message]
        .filter(Boolean).join('\n').toLocaleLowerCase().includes(state.query);
    }

    function renderTest(test) {
      const details = createElement('details', 'test');
      if (test.status === 'failed') details.open = true;
      const summary = createElement('summary', 'test-summary');
      summary.append(
        createElement('span', 'chevron', '›'),
        createElement('span', `status-dot ${test.status}`),
        createElement('span', 'test-name', test.name),
        createElement('span', 'class-name meta', test.className || '—'),
        createElement('span', `badge ${test.status}`, test.status)
      );
      details.append(summary);
      if (test.failure) {
        const failure = createElement('div', 'failure');
        failure.append(
          createElement('div', 'failure-type', test.failure.type),
          createElement('div', 'failure-message', test.failure.message),
          createElement('div', 'meta', `Duration: ${formatDuration(test.durationSeconds)} · Class: ${test.className || '—'}`)
        );
        details.append(failure);
      }
      return details;
    }

    function renderResults() {
      const nodes = [];
      state.report.suites.forEach(suite => {
        const tests = suite.tests.filter(test => matches(test, suite.name));
        if (!tests.length) return;
        const details = createElement('details', 'suite');
        if (tests.some(test => test.status === 'failed')) details.open = true;
        const summary = createElement('summary', 'suite-summary');
        summary.append(
          createElement('span', 'chevron', '›'),
          createElement('span', '', suite.name),
          createElement('span', 'suite-duration meta', formatDuration(suite.durationSeconds)),
          createElement('span', 'meta', `${tests.length} cases`)
        );
        const list = createElement('div', 'tests');
        tests.forEach(test => list.append(renderTest(test)));
        details.append(summary, list);
        nodes.push(details);
      });
      if (!nodes.length) nodes.push(createElement('div', 'empty', '沒有符合目前條件的測試案例。'));
      elements.results.replaceChildren(...nodes);
    }

    function showError(message) {
      elements.notice.textContent = message;
      elements.notice.classList.remove('hidden');
    }

    function clearError() {
      elements.notice.textContent = '';
      elements.notice.classList.add('hidden');
    }

    async function loadFile(file) {
      clearError();
      try {
        requireCondition(file && file.name.toLocaleLowerCase().endsWith('.xml'), '請選擇 .xml 報告檔。');
        requireCondition(file.size <= maxFileBytes, 'XML 檔案不可超過 10 MB。');
        state.report = parseXUnitXml(await file.text());
        state.status = 'all';
        state.query = '';
        elements.searchInput.value = '';
        elements.filters.querySelectorAll('button').forEach(button => button.classList.toggle('active', button.dataset.status === 'all'));
        elements.dropZone.classList.add('hidden');
        elements.report.classList.remove('hidden');
        elements.printButton.disabled = false;
        const summary = deriveSummary(state.report);
        elements.subtitle.textContent = `${file.name} · ${summary.suites} suites · ${summary.tests} cases`;
        renderSummary(state.report);
        renderResults();
      } catch (error) {
        showError(`無法載入報告：${error instanceof Error ? error.message : String(error)}`);
      } finally {
        elements.fileInput.value = '';
      }
    }

    function openFilePicker() { elements.fileInput.click(); }
    elements.openButton.addEventListener('click', openFilePicker);
    elements.dropOpenButton.addEventListener('click', openFilePicker);
    elements.fileInput.addEventListener('change', event => loadFile(event.target.files[0]));
    elements.printButton.addEventListener('click', () => window.print());
    elements.searchInput.addEventListener('input', event => {
      state.query = event.target.value.trim().toLocaleLowerCase();
      renderResults();
    });
    elements.filters.addEventListener('click', event => {
      const button = event.target.closest('button[data-status]');
      if (!button) return;
      state.status = button.dataset.status;
      elements.filters.querySelectorAll('button').forEach(item => item.classList.toggle('active', item === button));
      renderResults();
    });

    for (const eventName of ['dragenter', 'dragover']) {
      document.addEventListener(eventName, event => {
        event.preventDefault();
        elements.dropZone.classList.add('dragging');
      });
    }
    for (const eventName of ['dragleave', 'drop']) {
      document.addEventListener(eventName, event => {
        event.preventDefault();
        elements.dropZone.classList.remove('dragging');
      });
    }
    document.addEventListener('drop', event => loadFile(event.dataTransfer.files[0]));

    let printOpenState = [];
    window.addEventListener('beforeprint', () => {
      printOpenState = [...document.querySelectorAll('#results details')].map(details => details.open);
      document.querySelectorAll('#results details').forEach(details => { details.open = true; });
    });
    window.addEventListener('afterprint', () => {
      document.querySelectorAll('#results details').forEach((details, index) => { details.open = printOpenState[index] ?? details.open; });
    });
  </script>
</body>
</html>
